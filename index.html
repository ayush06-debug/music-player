<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>VinylVault Music</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-light: #2a2a2a;
      --accent: #0f766e;
      --accent-glow: #14b8a6;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 100px;
    }

    .app-container { width: 100%; max-width: 430px; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-light);
      color: var(--accent-glow);
      cursor: pointer;
    }

    .turntable {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--surface);
      padding: 28px 20px;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
      margin-bottom: 20px;
    }

    .vinyl-wrapper {
      position: relative;
      width: 230px;
      height: 230px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl-disc {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        radial-gradient(circle, transparent 36%, rgba(255,255,255,0.04) 37%, transparent 38%),
        radial-gradient(circle, transparent 48%, rgba(255,255,255,0.04) 49%, transparent 50%),
        radial-gradient(circle, transparent 60%, rgba(255,255,255,0.04) 61%, transparent 62%),
        repeating-radial-gradient(#141414 0, #141414 3px, #1d1d1d 4px, #141414 5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.7), inset 0 0 0 3px #2c2c2c;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 10s linear infinite;
      animation-play-state: paused;
    }

    .vinyl-disc.playing { animation-play-state: running; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .album-art {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #111;
      background: #2b2b2b;
    }

    .spindle-hole {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid #444;
      z-index: 3;
    }

    .track-info { text-align: center; width: 100%; margin-bottom: 16px; }
    .track-title { font-size: 1.15rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 0.88rem; color: var(--muted); margin-top: 4px; }

    .progress-wrap { width: 100%; margin-bottom: 18px; }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-glow);
      height: 5px;
      border-radius: 5px;
      cursor: pointer;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .btn-ctrl {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 10px;
      border-radius: 50%;
    }
    .btn-play {
      width: 62px;
      height: 62px;
      background: var(--accent);
      color: #fff;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(15, 118, 110, 0.5);
    }

    .upload-toggle {
      width: 100%;
      padding: 13px;
      background: var(--surface-light);
      color: var(--text);
      border: 1px solid #333;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .upload-box {
      display: none;
      background: var(--surface);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid #2e2e2e;
    }
    .upload-box.open { display: block; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; }
    .field input[type="text"], .field input[type="file"] {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid #333;
      border-radius: 10px;
      color: var(--text);
      font-size: 0.9rem;
    }
    .btn-upload {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-upload:disabled { opacity: 0.5; }

    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .song-list { display: flex; flex-direction: column; gap: 10px; }
    .song-item {
      display: flex;
      align-items: center;
      background: var(--surface);
      padding: 10px 12px;
      border-radius: 14px;
      gap: 12px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .song-item.active {
      border-color: var(--accent-glow);
      background: #1b2827;
    }
    .song-thumb {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
      background: #2c2c2c;
      flex-shrink: 0;
    }
    .song-meta { flex: 1; min-width: 0; }
    .song-meta h4 { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-meta p { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .offline-pill {
      font-size: 0.68rem;
      padding: 3px 7px;
      border-radius: 6px;
      background: #262626;
      color: var(--muted);
    }
    .offline-pill.saved { background: rgba(20, 184, 166, 0.15); color: var(--accent-glow); }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>VinylVault</h1>
      <span id="netStatus" class="status-badge" title="Tap for status details">Syncing...</span>
    </header>

    <div class="turntable">
      <div class="vinyl-wrapper">
        <div id="vinylDisc" class="vinyl-disc">
          <img id="albumArt" class="album-art" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' fill='%230f766e'/><circle cx='100' cy='100' r='30' fill='%23121212'/></svg>" alt="Album Art" />
        </div>
        <div class="spindle-hole"></div>
      </div>

      <div class="track-info">
        <div id="trackTitle" class="track-title">Select or Upload a Song</div>
        <div id="trackArtist" class="track-artist">Your Cloud + Offline Library</div>
      </div>

      <div class="progress-wrap">
        <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1" />
        <div class="time-row">
          <span id="curTime">0:00</span>
          <span id="durTime">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn-ctrl" id="prevBtn">&#9198;</button>
        <button class="btn-ctrl btn-play" id="playBtn">&#9654;</button>
        <button class="btn-ctrl" id="nextBtn">&#9197;</button>
      </div>
    </div>

    <button class="upload-toggle" id="toggleUploadBtn">+ Upload New Song to Cloud</button>
    <div class="upload-box" id="uploadBox">
      <div class="field">
        <label>Song Title *</label>
        <input type="text" id="songTitleInput" placeholder="e.g. Midnight Drive" />
      </div>
      <div class="field">
        <label>Artist Name</label>
        <input type="text" id="songArtistInput" placeholder="e.g. Lo-Fi Beats" />
      </div>
      <div class="field">
        <label>Audio File (MP3 / M4A / WAV) *</label>
        <input type="file" id="audioFileInput" accept="audio/*" />
      </div>
      <div class="field">
        <label>Album Cover Image (Optional)</label>
        <input type="file" id="coverFileInput" accept="image/*" />
      </div>
      <button class="btn-upload" id="uploadSubmitBtn">Upload & Save Forever</button>
    </div>

    <div class="playlist-header">
      <span>Your Library</span>
      <span id="songCount">0 tracks</span>
    </div>
    <div class="song-list" id="songList"></div>
  </div>

  <audio id="audioPlayer" crossorigin="anonymous"></audio>

  <script>
    const SUPABASE_URL = 'https://kwxuthrwdnpbemzszeix.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_MwVibZ5jqj0xnlQ1DCpuOA_BvI0I1HE';

    const DEFAULT_COVER = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' fill='%230f766e'/><text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='56' font-family='sans-serif'>&#9835;</text></svg>";

    let dbClient = null;
    let lastErrorMsg = 'No errors';
    let songs = [];
    let currentIndex = -1;
    let currentObjectUrl = null;

    const audio = document.getElementById('audioPlayer');
    const vinylDisc = document.getElementById('vinylDisc');
    const albumArt = document.getElementById('albumArt');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const seekBar = document.getElementById('seekBar');
    const curTime = document.getElementById('curTime');
    const durTime = document.getElementById('durTime');
    const songListEl = document.getElementById('songList');
    const songCountEl = document.getElementById('songCount');
    const netStatus = document.getElementById('netStatus');

    netStatus.onclick = () => alert('Status Details:\n' + lastErrorMsg);

    function openOfflineDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('VinylVaultOfflineDB', 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs', { keyPath: 'id' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveSongsMetaOffline(songArray) {
      const db = await openOfflineDB();
      const tx = db.transaction('meta', 'readwrite');
      const store = tx.objectStore('meta');
      store.clear();
      songArray.forEach(s => store.put(s));
    }

    async function getOfflineSongsMeta() {
      const db = await openOfflineDB();
      return new Promise((resolve) => {
        const tx = db.transaction('meta', 'readonly');
        const req = tx.objectStore('meta').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }

    async function getOfflineBlob(id) {
      const db = await openOfflineDB();
      return new Promise((resolve) => {
        const tx = db.transaction('blobs', 'readonly');
        const req = tx.objectStore('blobs').get(id);
        req.onsuccess = () => resolve(req.result ? req.result.blob : null);
        req.onerror = () => resolve(null);
      });
    }

    async function saveOfflineBlob(id, blob) {
      const db = await openOfflineDB();
      const tx = db.transaction('blobs', 'readwrite');
      tx.objectStore('blobs').put({ id, blob });
    }

    async function loadLibrary() {
      try {
        if (!window.supabase) {
          throw new Error('Supabase library failed to load (CDN blocked or offline)');
        }
        dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const timeoutPromise = new Promise((_, reject) =>
          setTimeout(() => reject(new Error('Connection timed out (ISP/DNS may be blocking supabase.co)')), 6000)
        );

        const queryPromise = dbClient
          .from('songs')
          .select('*')
          .order('created_at', { ascending: false });

        const { data, error } = await Promise.race([queryPromise, timeoutPromise]);

        if (error) throw error;
        songs = data || [];
        await saveSongsMetaOffline(songs);
        netStatus.textContent = 'Cloud Synced';
        lastErrorMsg = 'Connected to Supabase successfully.';
      } catch (err) {
        lastErrorMsg = err.message || String(err);
        songs = await getOfflineSongsMeta();
        netStatus.textContent = 'Offline (Tap for info)';
      }
      renderSongList();
    }

    async function renderSongList() {
      songCountEl.textContent = `${songs.length} track${songs.length === 1 ? '' : 's'}`;
      songListEl.innerHTML = '';

      for (let i = 0; i < songs.length; i++) {
        const song = songs[i];
        const cached = await getOfflineBlob(song.id);
        const item = document.createElement('div');
        item.className = 'song-item' + (i === currentIndex ? ' active' : '');
        item.innerHTML = `
          <img class="song-thumb" src="${song.cover_url || DEFAULT_COVER}" alt="Cover" />
          <div class="song-meta">
            <h4>${song.title}</h4>
            <p>${song.artist || 'Unknown Artist'}</p>
          </div>
          <span class="offline-pill ${cached ? 'saved' : ''}">${cached ? 'Offline Ready' : 'Cloud'}</span>
        `;
        item.onclick = () => playSong(i);
        songListEl.appendChild(item);
      }
    }

    async function playSong(index) {
      if (index < 0 || index >= songs.length) return;
      currentIndex = index;
      const song = songs[index];

      trackTitle.textContent = song.title;
      trackArtist.textContent = song.artist || 'Unknown Artist';
      albumArt.src = song.cover_url || DEFAULT_COVER;
      renderSongList();

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }

      const offlineBlob = await getOfflineBlob(song.id);
      if (offlineBlob) {
        currentObjectUrl = URL.createObjectURL(offlineBlob);
        audio.src = currentObjectUrl;
        audio.play();
      } else {
        audio.src = song.audio_url;
        audio.play();
        fetch(song.audio_url)
          .then(res => res.blob())
          .then(async blob => {
            await saveOfflineBlob(song.id, blob);
            renderSongList();
          })
          .catch(() => {});
      }
    }

    audio.addEventListener('play', () => {
      vinylDisc.classList.add('playing');
      playBtn.innerHTML = '&#10074;&#10074;';
    });

    audio.addEventListener('pause', () => {
      vinylDisc.classList.remove('playing');
      playBtn.innerHTML = '&#9654;';
    });

    audio.addEventListener('ended', () => {
      if (songs.length > 0) playSong((currentIndex + 1) % songs.length);
    });

    playBtn.onclick = () => {
      if (currentIndex === -1 && songs.length > 0) {
        playSong(0);
      } else if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    };

    prevBtn.onclick = () => {
      if (songs.length === 0) return;
      playSong((currentIndex - 1 + songs.length) % songs.length);
    };

    nextBtn.onclick = () => {
      if (songs.length === 0) return;
      playSong((currentIndex + 1) % songs.length);
    };

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      seekBar.value = (audio.currentTime / audio.duration) * 100;
      curTime.textContent = formatTime(audio.currentTime);
      durTime.textContent = formatTime(audio.duration);
    });

    seekBar.oninput = () => {
      if (!audio.duration) return;
      audio.currentTime = (seekBar.value / 100) * audio.duration;
    };

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    const toggleUploadBtn = document.getElementById('toggleUploadBtn');
    const uploadBox = document.getElementById('uploadBox');
    const uploadSubmitBtn = document.getElementById('uploadSubmitBtn');

    toggleUploadBtn.onclick = () => uploadBox.classList.toggle('open');

    uploadSubmitBtn.onclick = async () => {
      if (!dbClient) {
        alert('Cannot upload right now: ' + lastErrorMsg);
        return;
      }
      const title = document.getElementById('songTitleInput').value.trim();
      const artist = document.getElementById('songArtistInput').value.trim();
      const audioFile = document.getElementById('audioFileInput').files[0];
      const coverFile = document.getElementById('coverFileInput').files[0];

      if (!title || !audioFile) {
        alert('Please enter a song title and choose an audio file.');
        return;
      }

      uploadSubmitBtn.disabled = true;
      uploadSubmitBtn.textContent = 'Uploading to Cloud...';

      try {
        const audioExt = audioFile.name.split('.').pop();
        const audioPath = `tracks/${Date.now()}_${Math.random().toString(36).slice(2)}.${audioExt}`;
        const { error: audioErr } = await dbClient.storage.from('music').upload(audioPath, audioFile);
        if (audioErr) throw audioErr;
        const audioUrl = dbClient.storage.from('music').getPublicUrl(audioPath).data.publicUrl;

        let coverUrl = null;
        if (coverFile) {
          const coverExt = coverFile.name.split('.').pop();
          const coverPath = `covers/${Date.now()}_${Math.random().toString(36).slice(2)}.${coverExt}`;
          const { error: coverErr } = await dbClient.storage.from('music').upload(coverPath, coverFile);
          if (coverErr) throw coverErr;
          coverUrl = dbClient.storage.from('music').getPublicUrl(coverPath).data.publicUrl;
        }

        const { data: inserted, error: dbErr } = await dbClient
          .from('songs')
          .insert([{ title, artist: artist || 'Unknown Artist', audio_url: audioUrl, cover_url: coverUrl }])
          .select();

        if (dbErr) throw dbErr;

        if (inserted && inserted[0]) {
          await saveOfflineBlob(inserted[0].id, audioFile);
        }

        document.getElementById('songTitleInput').value = '';
        document.getElementById('songArtistInput').value = '';
        document.getElementById('audioFileInput').value = '';
        document.getElementById('coverFileInput').value = '';
        uploadBox.classList.remove('open');
        await loadLibrary();
        alert('Uploaded! You can now safely delete the file from your phone storage.');
      } catch (err) {
        alert('Upload failed: ' + err.message);
      } finally {
        uploadSubmitBtn.disabled = false;
        uploadSubmitBtn.textContent = 'Upload & Save Forever';
      }
    };

    loadLibrary();
  </script>
</body>
</html>
