<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121212" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.json" />
  <title>VinylVault Music</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-light: #2a2a2a;
      --accent: #0f766e;
      --accent-glow: #14b8a6;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 100px;
    }

    .app-container { width: 100%; max-width: 430px; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-light);
      color: var(--accent-glow);
      cursor: pointer;
    }

    .turntable {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--surface);
      padding: 28px 20px;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
      margin-bottom: 20px;
    }

    .vinyl-wrapper {
      position: relative;
      width: 230px;
      height: 230px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl-disc {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        radial-gradient(circle, transparent 36%, rgba(255,255,255,0.04) 37%, transparent 38%),
        radial-gradient(circle, transparent 48%, rgba(255,255,255,0.04) 49%, transparent 50%),
        radial-gradient(circle, transparent 60%, rgba(255,255,255,0.04) 61%, transparent 62%),
        repeating-radial-gradient(#141414 0, #141414 3px, #1d1d1d 4px, #141414 5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.7), inset 0 0 0 3px #2c2c2c;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 10s linear infinite;
      animation-play-state: paused;
    }

    .vinyl-disc.playing { animation-play-state: running; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .album-art {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #111;
      background: #2b2b2b;
    }

    .spindle-hole {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
