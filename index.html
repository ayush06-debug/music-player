<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>VinylVault Music</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-light: #2a2a2a;
      --accent: #0f766e;
      --accent-glow: #14b8a6;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 100px;
    }

    .app-container { width: 100%; max-width: 430px; }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.5px; }
    .status-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-light);
      color: var(--accent-glow);
    }

    /* Rotating Vinyl Disc */
    .turntable {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--surface);
      padding: 28px 20px;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
      margin-bottom: 20px;
    }

    .vinyl-wrapper {
      position: relative;
      width: 230px;
      height: 230px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl-disc {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        radial-gradient(circle, transparent 36%, rgba(255,255,255,0.04) 37%, transparent 38%),
        radial-gradient(circle, transparent 48%, rgba(255,255,255,0.04) 49%, transparent 50%),
        radial-gradient(circle, transparent 60%, rgba(255,255,255,0.04) 61%, transparent 62%),
        repeating-radial-gradient(#141414 0, #141414 3px, #1d1d1d 4px, #141414 5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.7), inset 0 0 0 3px #2c2c2c;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 10s linear infinite;
      animation-play-state: paused;
    }

    .vinyl-disc.playing {
      animation-play-state: running;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .album-art {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #111;
      background: #2b2b2b;
    }

    .spindle-hole {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid #444;
      z-index: 3;
    }

    /* Track Details */
    .track-info { text-align: center; width: 100%; margin-bottom: 16px; }
    .track-title { font-size: 1.15rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 0.88rem; color: var(--muted); margin-top: 4px; }

    /* Progress Bar */
    .progress-wrap { width: 100%; margin-bottom: 18px; }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-glow);
      height: 5px;
      border-radius: 5px;
      cursor: pointer;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .btn-ctrl {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 10px;
      border-radius: 50%;
      transition: transform 0.15s;
    }
    .btn-ctrl:active { transform: scale(0.92); }
    .btn-play {
      width: 62px;
      height: 62px;
      background: var(--accent);
      color: #fff;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(15, 118, 110, 0.5);
    }

    /* Upload Section */
    .upload-toggle {
      width: 100%;
      padding: 13px;
      background: var(--surface-light);
      color: var(--text);
      border: 1px solid #333;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .upload-box {
      display: none;
      background: var(--surface);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid #2e2e2e;
    }
    .upload-box.open { display: block; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; }
    .field input[type="text"], .field input[type="file"] {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid #333;
      border-radius: 10px;
      color: var(--text);
      font-size: 0.9rem;
    }
    .btn-upload {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-upload:disabled { opacity: 0.5; }

    /* Playlist */
    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: var(--muted);
    }
    .song-list { display: flex; flex-direction: column; gap: 10px; }
    .song-item {
      display: flex;
      align-items: center;
      background: var(--surface);
      padding: 10px 12px;
      border-radius: 14px;
      gap: 12px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .song-item.active {
      border-color: var(--accent-glow);
      background: #1b2827;
    }
    .song-thumb {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
      background: #2c2c2c;
      flex-shrink: 0;
    }
    .song-meta { flex: 1; min-width: 0; }
    .song-meta h4 { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-meta p { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .offline-pill {
      font-size: 0.68rem;
      padding: 3px 7px;
      border-radius: 6px;
      background: #262626;
      color: var(--muted);
    }
    .offline-pill.saved { background: rgba(20, 184, 166, 0.15); color: var(--accent-glow); }
  </style>
</head>

    <!-- Rotating Disc Player -->
    <div class="turntable">

          <img id="albumArt" class="album-art" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' fill='%230f766e'/><circle cx='100' cy='100' r='30' fill='%23121212'/></svg>" alt="Album Art" />
        </div>
        <div class="spindle-hole"></div>
      </div>

      <div class="track-info">
        <div id="trackTitle" class="track-title">Select or Upload a Song</div>
        <div id="trackArtist" class="track-artist">Your Cloud + Offline Library</div>
      </div>

      <div class="progress-wrap">
        <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1" />
        <div class="time-row">
          <span id="curTime">0:00</span>
          <span id="durTime">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn-ctrl" id="prevBtn" title="Previous">&#9198;</button>
        <button class="btn-ctrl btn-play" id="playBtn" title="Play/Pause">&#9654;</button>
        <button class="btn-ctrl" id="nextBtn" title="Next">&#9197;</button>
      </div>
    </div>

    <!-- Upload Drawer -->
    <button class="upload-toggle" id="toggleUploadBtn">+ Upload New Song to Cloud</button>
    <div class="upload-box" id="uploadBox">
      <div class="field">
        <label>Song Title *</label>
        <input type="text" id="songTitleInput" placeholder="e.g. Midnight Drive" />
      </div>
      <div class="field">
        <label>Artist Name</label>
        <input type="text" id="songArtistInput" placeholder="e.g. Lo-Fi Beats" />
      </div>
      <div class="field">
        <label>Audio File (MP3 / M4A / WAV) *</label>
        <input type="file" id="audioFileInput" accept="audio/*" />
      </div>
      <div class="field">
        <label>Album Cover Image (Optional)</label>
        <input type="file" id="coverFileInput" accept="image/*" />
      </div>
      <button class="btn-upload" id="uploadSubmitBtn">Upload & Save Forever</button>
    </div>

    <!-- Song Library -->
    <div class="playlist-header">
      <span>Your Library</span>
      <span id="songCount">0 tracks</span>
    </div>
    <div class="song-list" id="songList"></div>
  </div>

  <audio id="audioPlayer" crossorigin="anonymous"></audio>
